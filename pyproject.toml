[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idp-agent"
version = "0.1.0"
description = "Intelligent Document Processing with NLP and Agentic AI: reads technical documents, extracts structured data, verifies it and triggers actions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["nlp", "ocr", "document-processing", "agentic-ai", "llm", "fastapi", "mlops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
    "pillow>=10.0",
    "pydantic>=2.5",
    "pypdf>=4.0",
    "pytesseract>=0.3.10",
    "reportlab>=4.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
nlp = ["spacy>=3.7"]
llm = ["anthropic>=0.40"]
ocr-pdf = ["pdf2image>=1.17"]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
all = ["idp-agent[api,nlp,llm,ocr-pdf,dev]"]

[project.scripts]
idp = "idp_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
idp_agent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["idp_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"src/idp_agent/samples.py" = ["E501"]  # sample documents are data, not code

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
